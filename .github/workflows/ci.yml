name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install uv==0.12.10

      - name: Create locked environment
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=three_layer_installer --cov-report=term-missing --cov-fail-under=80

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel outside checkout
        run: uv run python scripts/smoke_wheel.py

      - name: Validate Bash launcher syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Smoke-test launcher in isolated home and PATH
        run: uv run python scripts/smoke_launcher.py

      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
