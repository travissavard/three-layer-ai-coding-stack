name: Live tool integration (not client E2E)

on:
  push:
    branches: [test/real-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tools:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test prerequisite
        run: python -m pip install uv==0.12.10
      - name: Set up Go prerequisite
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false
      - name: Create virtual environment
        run: uv sync --frozen
      - name: Test real tools on Linux or macOS
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/live_tools.py --languages typescript,python,go
      - name: Test real tools in disposable Windows user profile
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/live_tools.py --ci-native-home --languages typescript,python,go
      - name: Show sanitized evidence (including explicit unproven items)
        if: always()
        run: python -m json.tool .e2e-results/live-tools.json
