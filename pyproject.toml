[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "three-layer-ai-coding-stack"
version = "0.1.0"
description = "Cross-platform installer for RTK, native LSP, and jMunch AI coding-agent integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "three-layer-ai-coding-stack contributors" }]
dependencies = ["tomlkit==0.15.1"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[project.scripts]
three-layer-install = "three_layer_installer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/three_layer_installer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["three_layer_installer"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["three_layer_installer"]
